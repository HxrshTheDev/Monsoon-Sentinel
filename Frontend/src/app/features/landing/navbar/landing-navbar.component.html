<header class="landing-nav">
  <div class="nav-container">
    <!-- Brand Logo & Title -->
    <a routerLink="/" class="brand-logo" aria-label="FloodWatch AI Homepage">
      <div class="logo-symbol">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
          <path d="M9 13.5c1.5 1 3.5 1 5 0"></path>
        </svg>
      </div>
      <div class="brand-text">
        <div class="title-row">
          <span class="brand-title">FloodWatch<span class="ai-badge">AI</span></span>
        </div>
        <span class="sub-agency">BMC Greater Mumbai</span>
      </div>
    </a>

    <!-- Desktop Nav Links -->
    <nav class="nav-links" aria-label="Main Navigation">
      <button type="button" class="nav-link" (click)="scrollToSection('features')">Capabilities</button>
      <button type="button" class="nav-link" (click)="scrollToSection('how-it-works')">How It Works</button>
      <button type="button" class="nav-link" (click)="scrollToSection('architecture')">Architecture</button>
      <button type="button" class="nav-link" (click)="scrollToSection('safe-mobility')">Safe Mobility</button>
      <a routerLink="/flood-map" class="nav-link nav-link--highlight">
        <span class="live-dot"></span> GIS Map
      </a>
      <a routerLink="/dashboard" class="nav-link">EOC Dashboard</a>
    </nav>

    <!-- Desktop Action Buttons -->
    <div class="nav-actions">
      <!-- Light / Dark Theme Switcher -->
      <button
        type="button"
        class="theme-toggle-btn"
        (click)="themeService.toggleTheme()"
        [title]="themeService.currentTheme() === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
        aria-label="Toggle theme mode"
      >
        @if (themeService.currentTheme() === 'dark') {
          <!-- Sun icon for light mode switch -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        } @else {
          <!-- Moon icon for dark mode switch -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        }
      </button>

      <!-- Auth: Sign In -->
      <a routerLink="/login" class="btn btn-outline btn-signin" id="nav-login-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        Sign In
      </a>

      <!-- Auth: Citizen Sign Up -->
      <a routerLink="/register" class="btn btn-primary btn-signup" id="nav-signup-btn">
        <span>Citizen Signup</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>

      <!-- Mobile Hamburger Button -->
      <button
        type="button"
        class="mobile-toggle"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-label="Toggle mobile menu"
      >
        @if (mobileMenuOpen()) {
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        } @else {
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- Mobile Drawer Menu -->
  @if (mobileMenuOpen()) {
    <div class="mobile-drawer" role="dialog" aria-modal="true" aria-label="Mobile Navigation">
      <div class="mobile-drawer__header">
        <span class="mobile-drawer__title">Navigation</span>
        <button type="button" class="btn-close" (click)="closeMobileMenu()" aria-label="Close menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="mobile-drawer__links">
        <button type="button" class="mobile-link" (click)="scrollToSection('features')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
          Capabilities
        </button>
        <button type="button" class="mobile-link" (click)="scrollToSection('how-it-works')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          How It Works
        </button>
        <button type="button" class="mobile-link" (click)="scrollToSection('architecture')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
            <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
            <line x1="6" y1="6" x2="6.01" y2="6"></line>
            <line x1="6" y1="18" x2="6.01" y2="18"></line>
          </svg>
          Architecture
        </button>
        <button type="button" class="mobile-link" (click)="scrollToSection('safe-mobility')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
          </svg>
          Safe Mobility
        </button>
        <a routerLink="/flood-map" (click)="closeMobileMenu()" class="mobile-link mobile-link--accent">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
            <line x1="8" y1="2" x2="8" y2="18"></line>
            <line x1="16" y1="6" x2="16" y2="22"></line>
          </svg>
          Interactive GIS Map
        </a>
        <a routerLink="/dashboard" (click)="closeMobileMenu()" class="mobile-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          Launch EOC Dashboard
        </a>
      </div>

      <div class="mobile-drawer__footer">
        <div class="theme-row">
          <span>Display Appearance</span>
          <button type="button" class="btn btn-outline btn-sm" (click)="themeService.toggleTheme()">
            {{ themeService.currentTheme() === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode' }}
          </button>
        </div>
        <div class="mobile-auth-actions">
          <a routerLink="/login" (click)="closeMobileMenu()" class="btn btn-outline btn-block">Sign In</a>
          <a routerLink="/register" (click)="closeMobileMenu()" class="btn btn-primary btn-block">Citizen Sign Up</a>
        </div>
      </div>
    </div>
  }
</header>
